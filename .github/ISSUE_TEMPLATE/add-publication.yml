name: Add a publication
description: A new paper, conference paper or thesis — or one that is missing from the list.
title: "Publication: "
labels:
  - website
  - publication
body:
  - type: markdown
    attributes:
      value: |
        **If it has a DOI, the DOI is all that is really needed** — the title, authors,
        journal, year and citation count are all looked up from it.

        Theses and older conference papers usually have no DOI. In that case fill in
        the title, authors and year instead. Anything left blank is left off the site
        rather than guessed.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of publication is it?
      description: This decides which section of the Publications page it appears in.
      options:
        - Journal article
        - Conference paper
        - Thesis
        - Other output (book chapter, report, preprint)
    validations:
      required: true

  - type: input
    id: doi
    attributes:
      label: DOI
      description: The DOI or the full doi.org link. Leave blank if there isn't one.
      placeholder: "10.1002/wwp2.70094"

  - type: input
    id: title
    attributes:
      label: Title
      description: Required only if there is no DOI.

  - type: input
    id: authors
    attributes:
      label: Authors
      description: >
        Required only if there is no DOI. In publication order, as they appear on the
        paper. For a thesis, the candidate's name.
      placeholder: "Gajurel, S., Maheshwari, B., Hagare, D."

  - type: input
    id: venue
    attributes:
      label: Journal, conference or institution
      description: >
        Required only if there is no DOI. For a thesis, the awarding university and
        the degree — for example "PhD, Western Sydney University".

  - type: input
    id: year
    attributes:
      label: Year
      description: Required only if there is no DOI.
      placeholder: "2026"

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >
        Corrections to an existing entry, a supervision role for a thesis, or a note
        about the work. You can also ask for a change to the page itself here — a new
        section, a different order, or a section that starts open rather than folded
        away.

  - type: checkboxes
    id: approval
    attributes:
      label: Confirmation
      options:
        - label: This work is published, accepted or awarded, and may appear on the public website.
          required: true
