name: Check website

# Runs the same gate as the publish workflow, but on pull requests, so a
# problem is visible in the review rather than after it has gone live.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # On a pull request the page is not rebuilt, only checked: a branch
      # whose index.html disagrees with its content/ would publish something
      # nobody reviewed.
      - name: Check index.html matches content/
        run: node scripts/build.mjs --check

      - name: Verify the website
        run: node checks/verify.mjs
