name: Publish website

# The site publishes itself. Merging a change into `main` is the whole
# release process — there is nothing to run by hand.
#
# GitHub Pages for this repository is configured with build_type "workflow",
# which means Pages serves whatever this workflow uploads and nothing else.
# Pushing index.html without this file would deploy nothing at all.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Read website source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The gate. There is no build step to catch a mistake, so this is the
      # only thing standing between a bad edit and the public site. If it
      # exits non-zero, nothing is published.
      - name: Verify the website
        run: node checks/verify.mjs

      # The site is one self-contained file. Everything else in the
      # repository — the checker, the guides, the issue templates — is
      # tooling for editors and is deliberately not published.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
