name: Publish website

# The site publishes itself. A change reaching `main` — whether pushed by a
# person or saved from the editor at /admin/ — is built, checked and deployed
# with nothing to run by hand.
#
# GitHub Pages for this repository is configured with build_type "workflow",
# which means Pages serves whatever this workflow uploads and nothing else.
# Pushing index.html without this file would deploy nothing at all.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write      # needed to commit the rebuilt index.html back
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Read website source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The editor saves JSON into content/. This copies it into the arrays
      # inside index.html, which is what the site actually reads — the page
      # stays one self-contained file rather than fetching its own content.
      - name: Build index.html from content/
        run: node scripts/build.mjs

      # Keep the repository honest: if the build changed index.html, commit
      # it so the file on GitHub always matches the content beside it.
      # "[skip ci]" stops this push from starting another run.
      # Never let this stop a deploy. If the repository's Actions token is
      # read-only, the push fails — but the built page is already correct
      # and publishing it matters more than tidying the repository. The
      # checker warns about the resulting drift on the next run.
      - name: Commit the rebuilt page
        continue-on-error: true
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html was already in step with content/"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Rebuild index.html from content/ [skip ci]"
            git push
            echo "index.html rebuilt and committed"
          fi

      # The gate. There is no compiler here, so this is the only thing
      # between an edit and the public site. A failure stops the deploy.
      - name: Verify the website
        run: node checks/verify.mjs

      # index.html is the site. admin/ is the editor, published alongside it
      # so Basant can reach it at /admin/. Everything else in the repository
      # is tooling and is deliberately not published.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R admin _site/admin

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
