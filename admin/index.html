<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Edit the website — Basant Maheshwari</title>
</head>
<body>
  <!-- Decap CMS, not Sveltia.
       Sveltia accepts a custom preview template and never renders it — the
       preview pane simply goes blank (measured: zero calls under five name
       variants, with both a function and a class component; it does not
       bundle React, which the API needs). Decap does render them, which is
       what lets the preview below be the real website rather than a list
       of field values. The other sites in this family use Decap for the
       same reason. -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="preview.js"></script>
</body>
</html>
