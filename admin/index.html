  <!-- Sveltia CMS, vendored rather than fetched from a CDN. Nothing here is
       loaded from a third party, and the editor cannot change underfoot
       without someone choosing to update this file.

       The preview is not in this pane: Sveltia does not render custom
       preview templates (measured — it accepts the registration and never
       calls it). Instead the "Live Site" button opens the real page in
       ?preview mode, where it watches the repository and redraws seconds
       after every save. `display_url` in config.yml points at it. -->
  <script src="sveltia-cms.js"></script>
</body>
