<!doctype html>
<!-- data-theme picks Sveltia's light palette; its own CSS only follows the
     operating system on :root:not([data-theme]), so setting it wins. And
     data-auto-theming stops its script putting the dark one back the moment
     the machine is in dark mode. -->
<html lang="en" data-theme="light" data-auto-theming="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Editor — Basant Maheshwari</title>
  <!-- Say where the config is rather than relying on the default. Sveltia
       looks for /admin/config.yml beside a page called index.html; this
       page is cms.html, framed by the split screen next door, so without
       this it reports "The configuration file could not be retrieved." -->
  <link rel="cms-config-url" type="text/yaml" href="config.yml">
</head>
<body>
  <!-- Sveltia CMS, vendored rather than fetched from a CDN. Nothing here is
       loaded from a third party, and the editor cannot change underfoot
       without someone choosing to update this file.

       The preview is not in this pane: Sveltia does not render custom
       preview templates (measured — it accepts the registration and never
       calls it). Instead the "Live Site" button opens the real page in
       ?preview mode, where it watches the repository and redraws seconds
       after every save. `display_url` in config.yml points at it. -->
  <script src="sveltia-cms.js"></script>

  <!-- Push each save straight to the preview.

       The preview used to rely on polling raw.githubusercontent.com every
       four seconds with a ?t= cache-buster on the URL. That buster does
       nothing: raw.githubusercontent.com does not vary its cache on the
       query string, so every distinct ?t= still answers `x-cache: HIT`
       from a copy held under `max-age=300`. A save could take five minutes
       to appear, and no amount of polling made it faster.

       So the editor hands the content over directly instead. Sveltia fires
       postSave with the entry that was just written; the parent frame
       relays it to the preview, which redraws immediately without asking
       the network for anything. The poll stays on as a slow backstop for
       edits made somewhere else. -->
  <script>
  (function () {
    /* Only useful inside the split screen — opened on its own there is no
       preview to talk to. */
    if (window.parent === window) return;

    function announce(entry) {
      try {
        const get  = k => (typeof entry?.get === "function" ? entry.get(k) : entry?.[k]);
        const path = get("path");
        const raw  = get("data");
        /* Decap hands out Immutable maps and Sveltia copies that shape. */
        const data = raw && typeof raw.toJS === "function" ? raw.toJS() : raw;
        if (!path || !data) return;
        window.parent.postMessage(
          {source: "bm-editor", file: String(path).split("/").pop(), data},
          window.location.origin);
      } catch (e) {
        /* A failure here must never take the save down with it. */
        console.error("could not send the save to the preview", e);
      }
    }

    /* CMS is defined by the bundle above, but registration is only accepted
       once it has finished starting up. */
    let tries = 0;
    (function register() {
      if (!window.CMS || typeof window.CMS.registerEventListener !== "function") {
        if (tries++ < 100) return void setTimeout(register, 100);
        return console.warn("Sveltia exposed no event API — the preview will fall back to polling");
      }
      for (const name of ["postSave", "postPublish"]) {
        try { window.CMS.registerEventListener({name, handler: ({entry}) => announce(entry)}); }
        catch (e) { console.error("could not listen for " + name, e); }
      }
    })();
  })();
  </script>
</body>
</html>
