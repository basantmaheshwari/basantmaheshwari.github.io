# Sveltia CMS — the editing interface for basantmaheshwari.github.io
#
# The sidebar mirrors the website: one entry per page of the site, in the same
# order as its menu. Opening "Publications" here edits the Publications page
# and nothing else, so it is always clear what a change will affect.
#
# The preview is the real website: the "Live Site" button opens it in
# ?preview mode, where it watches the repository and redraws within seconds
# of a save — the finished page, effects and all.
#
# Saving commits JSON to `main`. The publish workflow then runs
# scripts/build.mjs to copy the content into index.html and deploys it.
#
# `base_url` points at the service that signs editors in with GitHub. It must
# exist before saving will work — see MAINTAINING.md, "Setting up the editor".

backend:
  name: github
  repo: basantmaheshwari/basantmaheshwari
  branch: main
  # The same authentication worker the other sites in this family already
  # use, so nothing new has to be deployed. If "Sign in with GitHub" refuses
  # this origin, add https://basantmaheshwari.github.io to the worker's
  # ALLOWED_ORIGINS — or use Sveltia's personal access token button, which
  # needs no worker at all.
  base_url: https://sveltia-cms-auth.marvi-groundwater.workers.dev
  commit_messages:
    create: 'Edit {{collection}} in the website editor'
    update: 'Edit {{collection}} in the website editor'
    delete: 'Remove an entry from {{collection}}'

# Images are embedded in index.html as data URIs, so there is no media folder
# to write into. Uploads are off rather than pointing somewhere that would
# silently do nothing.
media_folder: ''
public_folder: ''

site_url: https://basantmaheshwari.github.io/basantmaheshwari/
# "Live Site" opens the instant preview: the exact page, effects and all,
# re-rendering seconds after every save.
display_url: https://basantmaheshwari.github.io/basantmaheshwari/?preview

collections:
  # ── 00 Profile ────────────────────────────────────────────────────────
  - name: profile
    label: '00 · Profile page'
    icon: person
    files:
      - name: profile_metrics
        label: The four figures
        file: content/metrics.json
        format: json
        preview_path: ''
        description: >
          The four figures shown on the front page. Check them against Google
          Scholar before changing, and update them together so they agree.
        fields:
          - name: items
            label: Figures
            label_singular: figure
            widget: list
            max: 4
            summary: '{{fields.value}} — {{fields.label}}'
            fields:
              - {name: value, label: Figure, widget: string}
              - {name: label, label: Caption, widget: string,
                 hint: 'Use <br> to split it over two lines.'}

  # ── 01 Research ───────────────────────────────────────────────────────
  - name: research
    label: '01 · Research page'
    icon: science
    files:
      - name: research_themes
        label: Research themes
        file: content/research.json
        format: json
        fields:
          - name: items
            label: Themes
            label_singular: theme
            widget: list
            summary: '{{fields.name}}'
            fields:
              - {name: name, label: Theme, widget: string}
              - {name: year, label: When, widget: string, default: Ongoing}
              - {name: status, label: Status, widget: string, default: current,
                 hint: '"current" is highlighted; anything else is plain.'}
              - {name: blurb, label: Description, widget: text}
              - {name: tags, label: Tags, widget: list, required: false, allow_add: true}

  # ── 02 Publications ───────────────────────────────────────────────────
  - name: publications
    label: '02 · Publications page'
    icon: menu_book
    files:
      - name: publications_list
        label: The publication list
        file: content/publications.json
        format: json
        description: >
          Every paper on the Publications page, newest first. A DOI is the only
          thing really needed — the rest can be looked up from it.
        fields:
          - name: items
            label: Publications
            label_singular: publication
            widget: list
            summary: '{{fields.y}} · {{fields.t}}'
            fields:
              - {name: k, label: Which section it appears in, widget: select, default: journal,
                 options: [{label: Journal article, value: journal},
                           {label: Conference paper, value: conference},
                           {label: Thesis, value: thesis},
                           {label: Other output, value: other}]}
              - {name: y, label: Year, widget: number, value_type: int, min: 1960, max: 2100}
              - {name: t, label: Title, widget: string}
              - {name: a, label: Authors, widget: string, required: false,
                 hint: 'Family, I. — comma separated, six then "et al." Write his own name exactly "Maheshwari, B." so it is emboldened.'}
              - {name: v, label: Journal or venue, widget: string}
              - {name: d, label: DOI, widget: string, required: false,
                 hint: 'Leave empty if there is none — the title is then listed without a link.',
                 pattern: ['^$|^10\.\d{4,9}/\S+$', 'Must look like 10.1002/wwp2.70094, or be empty']}
              - {name: c, label: Citations, widget: number, value_type: int, required: false, min: 0}

      - name: publications_sections
        label: Its sections
        file: content/pub-kinds.json
        format: json
        description: >
          The headings the publication list is grouped under, in order. A
          section with nothing in it still appears, showing its message.
        fields:
          - name: items
            label: Sections
            label_singular: section
            widget: list
            summary: '{{fields.label}}'
            fields:
              - {name: id, label: Identifier, widget: string,
                 hint: 'Lowercase, no spaces. Publications point at this.'}
              - {name: label, label: Heading, widget: string}
              - {name: empty, label: Shown when it is empty, widget: text}
              - {name: open, label: Starts expanded, widget: boolean, required: false, default: false}

  # ── 03 Programmes ─────────────────────────────────────────────────────
  - name: programmes
    label: '03 · Programmes page'
    icon: water_drop
    files:
      - name: programmes_list
        label: Programmes
        file: content/programs.json
        format: json
        fields:
          - name: items
            label: Programmes
            label_singular: programme
            widget: list
            summary: '{{fields.name}}'
            fields:
              - {name: name, label: Programme, widget: string}
              - {name: year, label: When, widget: string}
              - {name: status, label: Status, widget: string, default: current}
              - {name: blurb, label: Description, widget: text}
              - {name: tags, label: Tags, widget: list, required: false, allow_add: true}
              - name: links
                label: Links
                widget: list
                required: false
                fields:
                  - {name: label, label: Label, widget: string}
                  - {name: href, label: Address, widget: string}

  # ── 04 Team ───────────────────────────────────────────────────────────
  - name: team
    label: '04 · Team page'
    icon: group
    files:
      - name: team_people
        label: People
        file: content/team.json
        format: json
        description: >
          Only list someone who has agreed to appear. Never infer a role — a
          co-author is not a student, and a professor is a collaborator rather
          than a member of the group.
        fields:
          - name: items
            label: People
            label_singular: person
            widget: list
            summary: '{{fields.n}} — {{fields.p}}'
            fields:
              - {name: r, label: Which section they appear in, widget: select, default: phd,
                 options: [{label: Postdoctoral researcher, value: postdoc},
                           {label: PhD candidate, value: phd},
                           {label: Collaborator, value: collaborator},
                           {label: Other team member, value: other}]}
              - {name: n, label: Name, widget: string}
              - {name: p, label: Position, widget: string, required: false}
              - {name: f, label: What they work on, widget: text, required: false}
              - {name: w, label: Institution, widget: string, required: false,
                 hint: 'Only if they are not at Western Sydney University.'}
              - name: l
                label: Links
                widget: list
                required: false
                fields:
                  - {name: label, label: Label, widget: string}
                  - {name: href, label: Address, widget: string}

      - name: team_sections
        label: Its sections
        file: content/team-roles.json
        format: json
        fields:
          - name: items
            label: Sections
            label_singular: section
            widget: list
            summary: '{{fields.label}}'
            fields:
              - {name: id, label: Identifier, widget: string}
              - {name: label, label: Heading, widget: string}
              - {name: empty, label: Shown when it is empty, widget: text}

  # ── 05 Teaching ───────────────────────────────────────────────────────
  - name: teaching
    label: '05 · Teaching page'
    icon: school
    files:
      - name: teaching_areas
        label: Teaching and capacity building
        file: content/teaching.json
        format: json
        fields:
          - name: items
            label: Areas
            label_singular: area
            widget: list
            summary: '{{fields.name}}'
            fields:
              - {name: name, label: Area, widget: string}
              - {name: when, label: When, widget: string, default: Ongoing}
              - {name: blurb, label: Description, widget: text}

  # ── 06 News ───────────────────────────────────────────────────────────
  - name: news
    label: '06 · News page'
    icon: campaign
    files:
      - name: news_items
        label: News items
        file: content/news.json
        format: json
        description: Events, visits, awards and milestones. Newest first.
        fields:
          - name: items
            label: News
            label_singular: item
            widget: list
            summary: '{{fields.year}} · {{fields.name}}'
            fields:
              - {name: name, label: Headline, widget: string}
              - {name: year, label: When, widget: string,
                 hint: 'A month and year is enough — "Nov 2025".'}
              - {name: status, label: Kind, widget: string, default: event}
              - {name: blurb, label: The details, widget: text}
              - {name: tags, label: Tags, widget: list, required: false, allow_add: true}

  # ── 07 Contact ────────────────────────────────────────────────────────
  - name: contact
    label: '07 · Contact page'
    icon: mail
    files:
      - name: contact_channels
        label: Contact channels
        file: content/contact.json
        format: json
        fields:
          - name: items
            label: Channels
            label_singular: channel
            widget: list
            summary: '{{fields.label}}'
            fields:
              - {name: label, label: Label, widget: string}
              - {name: detail, label: Shown beside it, widget: string}
              - {name: href, label: Address, widget: string,
                 hint: 'A full https:// address, or mailto: for email.'}

  # ── The site itself ───────────────────────────────────────────────────
  - name: structure
    label: '⚙ Pages and menu'
    icon: account_tree
    files:
      - name: site_sections
        label: Pages and menu order
        file: content/sections.json
        format: json
        description: >
          Every page of the site, in menu order. This is the structure of the
          website itself — changing it changes what pages exist. Each entry
          needs a matching panel in index.html or a page definition; the
          publish check refuses a menu item that leads nowhere.
        fields:
          - name: items
            label: Pages
            label_singular: page
            widget: list
            summary: '{{fields.tc}} · {{fields.label}}'
            fields:
              - {name: id, label: Identifier, widget: string,
                 hint: 'Lowercase, no spaces. Also the #address of the page.'}
              - {name: label, label: Menu label, widget: string}
              - {name: tc, label: Number, widget: string,
                 hint: 'Two digits, in menu order: 00, 01, 02…'}
              - name: page
                label: Build this page here (optional)
                widget: object
                required: false
                collapsed: true
                hint: >
                  Leave empty for the pages that already exist. Fill it in and a
                  whole new page is built from what you put below — it appears in
                  the menu and gets its own address, with no code written anywhere.
                fields:
                  - {name: title, label: Heading, widget: string, required: false}
                  - {name: lede, label: One line under the heading, widget: text, required: false}
                  - name: blocks
                    label: Blocks
                    label_singular: block
                    widget: list
                    required: false
                    hint: 'Add as many as you like, in any order, mixing the kinds freely.'
                    types:
                      - label: Text
                        name: text
                        widget: object
                        summary: '{{fields.heading}}'
                        fields:
                          - {name: tag, label: Small label beside it, widget: string, required: false}
                          - {name: heading, label: Heading, widget: string, required: false}
                          - {name: paragraphs, label: Paragraphs, widget: list, field: {name: text, label: Paragraph, widget: text}}
                      - label: List of entries
                        name: entries
                        widget: object
                        summary: '{{fields.heading}}'
                        fields:
                          - {name: tag, label: Small label beside it, widget: string, required: false}
                          - {name: heading, label: Heading, widget: string, required: false}
                          - name: entries
                            label: Entries
                            label_singular: entry
                            widget: list
                            summary: '{{fields.name}}'
                            fields:
                              - {name: name, label: Name, widget: string}
                              - {name: year, label: When, widget: string, required: false}
                              - {name: status, label: Status, widget: string, required: false}
                              - {name: blurb, label: Description, widget: text, required: false}
                              - {name: tags, label: Tags, widget: list, required: false, allow_add: true}
