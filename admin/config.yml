# Sveltia CMS — the editing interface for basantmaheshwari.github.io
#
# The sidebar mirrors the website: one entry per page, in menu order, and each
# one opens a single form holding everything on that page. No sub-choices, no
# guessing which of two forms you want — the Publications page is one form
# with the list and its section headings in it, and so on.
#
# The preview is the real website: the "Live Site" button opens it in
# ?preview mode, where it watches the repository and redraws within seconds
# of a save — the finished page, effects and all.
#
# Saving commits JSON to `main`. The publish workflow then runs
# scripts/build.mjs to copy the content into index.html and deploys it.
#
# `base_url` points at the service that signs editors in with GitHub. It must
# exist before saving will work — see MAINTAINING.md, "Setting up the editor".

backend:
  name: github
  repo: basantmaheshwari/basantmaheshwari.github.io
  branch: main
  # Sign-in goes through a small authentication service, because a static
  # page cannot hold an OAuth secret. This one is an existing shared worker
  # and is NOT owned by this account — if it is ever withdrawn, sign-in here
  # stops with it. Two ways out, neither urgent:
  #   * Sveltia's personal access token button needs no worker at all.
  #   * Or deploy sveltia-cms-auth on Basant's own Cloudflare account and
  #     point base_url at that instead.
  # If "Sign in with GitHub" refuses this origin, add
  # https://basantmaheshwari.github.io to the worker's ALLOWED_ORIGINS.
  base_url: https://sveltia-cms-auth.marvi-groundwater.workers.dev
  commit_messages:
    create: 'Edit {{collection}} in the website editor'
    update: 'Edit {{collection}} in the website editor'
    delete: 'Remove an entry from {{collection}}'

# Uploaded images land in assets/ as ordinary files. scripts/build.mjs then
# inlines the portrait into index.html as a data URI, so the published page
# is still one self-contained file that fetches nothing.
media_folder: assets
public_folder: assets

site_url: https://basantmaheshwari.github.io/
# "Live Site" opens the instant preview: the exact page, effects and all,
# re-rendering seconds after every save.
display_url: https://basantmaheshwari.github.io/?preview

collections:
  - name: profile
    label: '00 · Profile page'
    icon: person
    files:
      - name: page_profile
        label: Profile page
        file: content/home.json
        format: json
        description: >
          The front page: the photograph, the headline and opening words, and the
          four figures beneath them.
        fields:
          - name: hero
            label: Photograph and opening words
            widget: object
            fields:
              - {name: portrait, label: Photograph, widget: image, required: false,
                 hint: 'Square works best. Uploading here replaces the picture on the site.'}
              - {name: portraitAlt, label: Photograph description, widget: string, required: false,
                 hint: 'Read aloud by screen readers.'}
              - {name: portraitCaption, label: Caption under the photograph, widget: string, required: false,
                 hint: 'A <br> splits it over two lines.'}
              - {name: eyebrow, label: Small line above the headline, widget: string, required: false}
              - {name: headline1, label: 'Headline — first line', widget: string, required: false}
              - {name: headline2, label: 'Headline — start of the second line', widget: string, required: false,
                 hint: 'Usually just "a " with a trailing space.'}
              - {name: headlineAccent, label: 'Headline — the word in colour', widget: string, required: false}
              - {name: headline3, label: 'Headline — rest of the second line', widget: string, required: false}
              - {name: role, label: Role, widget: text, required: false}
              - {name: bio, label: Opening paragraph, widget: text, required: false}
          - name: metrics
            label: The four figures
            label_singular: figure
            widget: list
            max: 4
            summary: '{{fields.value}} — {{fields.label}}'
            hint: 'Check them against Google Scholar, and update them together.'
            fields:
              - {name: value, label: Figure, widget: string}
              - {name: label, label: Caption, widget: string, hint: 'A <br> splits it over two lines.'}

  - name: research
    label: '01 · Research page'
    icon: science
    files:
      - name: page_research
        label: Research page
        file: content/research.json
        format: json
        fields:
          - name: items
            label: Research themes
            label_singular: theme
            widget: list
            summary: '{{fields.name}}'
            fields:
              - {name: name, label: Theme, widget: string}
              - {name: year, label: When, widget: string, default: Ongoing}
              - {name: status, label: Status, widget: string, default: current,
                 hint: '"current" is highlighted; anything else is plain.'}
              - {name: blurb, label: Description, widget: text}
              - {name: tags, label: Tags, widget: list, required: false, allow_add: true}

  - name: publications
    label: '02 · Publications page'
    icon: menu_book
    files:
      - name: page_publications
        label: Publications page
        file: content/publications.json
        format: json
        description: >
          The whole page: every paper, and the section headings they are grouped
          under.
        fields:
          - name: items
            label: Publications
            label_singular: publication
            widget: list
            summary: '{{fields.y}} · {{fields.t}}'
            fields:
              - {name: k, label: Which section it appears in, widget: select, default: journal,
                 options: [{label: Journal article, value: journal},
                           {label: Conference paper, value: conference},
                           {label: Thesis, value: thesis},
                           {label: Other output, value: other}]}
              - {name: y, label: Year, widget: number, value_type: int, min: 1960, max: 2100}
              - {name: t, label: Title, widget: string}
              - {name: a, label: Authors, widget: string, required: false,
                 hint: 'Family, I. — comma separated, six then "et al." Write his own name exactly "Maheshwari, B." so it is emboldened.'}
              - {name: v, label: Journal or venue, widget: string}
              - {name: d, label: DOI, widget: string, required: false,
                 hint: 'Leave empty if there is none — the title is then listed without a link.',
                 pattern: ['^$|^10\.\d{4,9}/\S+$', 'Must look like 10.1002/wwp2.70094, or be empty']}
              - {name: c, label: Citations, widget: number, value_type: int, required: false, min: 0}
          - name: sections
            label: Section headings on this page
            label_singular: section
            widget: list
            summary: '{{fields.label}}'
            hint: 'A section with nothing in it still appears, showing its message.'
            fields:
              - {name: id, label: Identifier, widget: string,
                 hint: 'Lowercase, no spaces. Publications point at this.'}
              - {name: label, label: Heading, widget: string}
              - {name: empty, label: Shown when it is empty, widget: text}
              - {name: open, label: Starts expanded, widget: boolean, required: false, default: false}

  - name: programmes
    label: '03 · Programmes page'
    icon: water_drop
    files:
      - name: page_programmes
        label: Programmes page
        file: content/programs.json
        format: json
        fields:
          - name: items
            label: Programmes
            label_singular: programme
            widget: list
            summary: '{{fields.name}}'
            fields:
              - {name: name, label: Programme, widget: string}
              - {name: year, label: When, widget: string}
              - {name: status, label: Status, widget: string, default: current}
              - {name: blurb, label: Description, widget: text}
              - {name: tags, label: Tags, widget: list, required: false, allow_add: true}
              - name: links
                label: Links
                widget: list
                required: false
                fields:
                  - {name: label, label: Label, widget: string}
                  - {name: href, label: Address, widget: string}

  - name: team
    label: '04 · Team page'
    icon: group
    files:
      - name: page_team
        label: Team page
        file: content/team.json
        format: json
        description: >
          Only list someone who has agreed to appear. Never infer a role — a
          co-author is not a student, and a professor is a collaborator rather
          than a member of the group.
        fields:
          - name: items
            label: People
            label_singular: person
            widget: list
            summary: '{{fields.n}} — {{fields.p}}'
            fields:
              - {name: r, label: Which section they appear in, widget: select, default: phd,
                 options: [{label: Postdoctoral researcher, value: postdoc},
                           {label: PhD candidate, value: phd},
                           {label: Collaborator, value: collaborator},
                           {label: Other team member, value: other}]}
              - {name: n, label: Name, widget: string}
              - {name: p, label: Position, widget: string, required: false}
              - {name: f, label: What they work on, widget: text, required: false}
              - {name: w, label: Institution, widget: string, required: false,
                 hint: 'Only if they are not at Western Sydney University.'}
              - name: l
                label: Links
                widget: list
                required: false
                fields:
                  - {name: label, label: Label, widget: string}
                  - {name: href, label: Address, widget: string}
          - name: sections
            label: Section headings on this page
            label_singular: section
            widget: list
            summary: '{{fields.label}}'
            fields:
              - {name: id, label: Identifier, widget: string}
              - {name: label, label: Heading, widget: string}
              - {name: empty, label: Shown when it is empty, widget: text}

  - name: teaching
    label: '05 · Teaching page'
    icon: school
    files:
      - name: page_teaching
        label: Teaching page
        file: content/teaching.json
        format: json
        fields:
          - name: items
            label: Areas
            label_singular: area
            widget: list
            summary: '{{fields.name}}'
            fields:
              - {name: name, label: Area, widget: string}
              - {name: when, label: When, widget: string, default: Ongoing}
              - {name: blurb, label: Description, widget: text}

  - name: news
    label: '06 · News page'
    icon: campaign
    files:
      - name: page_news
        label: News page
        file: content/news.json
        format: json
        description: Events, visits, awards and milestones. Newest first.
        fields:
          - name: items
            label: News
            label_singular: item
            widget: list
            summary: '{{fields.year}} · {{fields.name}}'
            fields:
              - {name: name, label: Headline, widget: string}
              - {name: year, label: When, widget: string, hint: 'A month and year is enough.'}
              - {name: status, label: Kind, widget: string, default: event}
              - {name: blurb, label: The details, widget: text}
              - {name: tags, label: Tags, widget: list, required: false, allow_add: true}

  - name: contact
    label: '07 · Contact page'
    icon: mail
    files:
      - name: page_contact
        label: Contact page
        file: content/contact.json
        format: json
        fields:
          - name: items
            label: Channels
            label_singular: channel
            widget: list
            summary: '{{fields.label}}'
            fields:
              - {name: label, label: Label, widget: string}
              - {name: detail, label: Shown beside it, widget: string}
              - {name: href, label: Address, widget: string,
                 hint: 'A full https:// address, or mailto: for email.'}

  - name: structure
    label: '⚙ Pages and menu'
    icon: account_tree
    files:
      - name: page_structure
        label: Pages and menu order
        file: content/sections.json
        format: json
        description: >
          Every page of the site, in menu order. Each entry needs a matching page
          in the site; the publish check refuses a menu item that leads nowhere.
        fields:
          - name: items
            label: Pages
            label_singular: page
            widget: list
            summary: '{{fields.tc}} · {{fields.label}}'
            fields:
              - {name: id, label: Identifier, widget: string,
                 hint: 'Lowercase, no spaces. Also the #address of the page.'}
              - {name: label, label: Menu label, widget: string}
              - {name: tc, label: Number, widget: string, hint: 'Two digits, in menu order.'}
